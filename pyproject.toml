[project]
name = "wreader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.2.1,<25",
    "aiohttp>=3.10.11,<4",
    "cssselect>=1.2,<2",
    "fastapi>=0.115.8,<1",
    "lxml>=5.2.2,<7",
    "mini-racer>=0.12.3,<1",
    "pydantic>=2.7.2,<3",
    "pyyaml>=6.0.1,<7",
    "uvicorn>=0.30,<1",
]

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
